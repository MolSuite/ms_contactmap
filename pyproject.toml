[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms_contactmap"
dynamic = ["version"]  # from the git tag, see [tool.setuptools_scm]
description = "MolSuite Interaction Profiler "
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mario S. Valdés-Tresanco" },
    { name = "Mario E. Valdés-Tresanco" },
    { name = "Ernesto Moreno" },
    { name = "Pedro A. Valiente" },
]
keywords = ["protein-ligand", "interactions", "contact-map", "molsuite", "structural-biology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "PySide6 >= 6.10",
    "rdkit >= 2025.3",
    "numpy >= 2.0",
    "scipy >= 1.15",
    "biopython >= 1.86"
]

[project.urls]
Homepage = "https://github.com/MolSuite/ms_contactmap"
Issues = "https://github.com/MolSuite/ms_contactmap/issues"

[project.scripts]
ms_contactmap = "ms_contactmap.__main__:main"

# The release tag is the only version there is: nothing to bump by hand, and
# a tag that does not match the metadata becomes impossible.
[tool.setuptools_scm]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ms_contactmap = [
    "*.toml",
    "data/*.json",
]
